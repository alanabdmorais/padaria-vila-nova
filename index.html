<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padaria Vila Nova</title>
<style>
  body {
    font-family: Georgia, serif;
    margin: 0;
    background: #f0f7ec;
    color: #2f4a2b;
  }
  header {
    background: #3f7a3a;
    color: #f0f7ec;
    padding: 2rem 1rem;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 2.5rem;
  }
  main {
    max-width: 700px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  .produtos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-top: 1.5rem;
  }
  .produto {
    background: #fff;
    border: 1px solid #cbe3c4;
    border-radius: 8px;
    padding: 1rem;
    text-align: center;
  }
  .produto h3 {
    margin: 0 0 0.5rem;
  }
  footer {
    text-align: center;
    padding: 1rem;
    color: #5c8a5c;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Padaria Vila Nova</h1>
    <p>Pão fresquinho todos os dias</p>
  </header>
  <main>
    <p>Bem-vindo à nossa padaria! Confira alguns dos nossos produtos:</p>
    <div class="produtos">
      <div class="produto">
        <h3>Pão Francês</h3>
        <p>R$ 0,80</p>
      </div>
      <div class="produto">
        <h3>Pão de Queijo</h3>
        <p>R$ 3,50</p>
      </div>
      <div class="produto">
        <h3>Bolo de Fubá</h3>
        <p>R$ 5,00 a fatia</p>
      </div>
      <div class="produto">
        <h3>Croissant</h3>
        <p>R$ 6,00</p>
      </div>
    </div>
  </main>
  <footer>
    &copy; Padaria Vila Nova
  </footer>
</body>
</html>
